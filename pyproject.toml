[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-content-engine"
version = "0.1.0"
description = "AI-assisted content production engine for creating, validating, and publishing technical short-form videos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Parmar Amit" }]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0.0",
    "mypy>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/content_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
